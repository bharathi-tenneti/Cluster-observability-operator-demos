---
# Patches the existing platform Alertmanager secret (openshift-monitoring/alertmanager-main)
# to add a New Relic webhook to the receivers that already exist out of the box.
# Route tree is untouched - only giving Default/Watchdog/Critical somewhere to send.
# Apply directly:  oc apply -f 01-alertmanager-main-newrelic-webhook.yaml
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-main
  namespace: openshift-monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      http_config:
        proxy_from_environment: true

    inhibit_rules:
      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = warning
        target_matchers:
          - severity = info

    receivers:
      - name: Default
        webhook_configs:
          - url: "<new-relic-workflow-webhook-url>"
            send_resolved: true
      - name: Watchdog
        webhook_configs:
          - url: "<new-relic-workflow-webhook-url>"
            send_resolved: true
      - name: Critical
        webhook_configs:
          - url: "<new-relic-workflow-webhook-url>"
            send_resolved: true

    route:
      group_by:
        - namespace
      group_interval: 5m
      group_wait: 30s
      receiver: Default
      repeat_interval: 12h
      routes:
        - matchers:
            - alertname = Watchdog
          receiver: Watchdog
        - matchers:
            - severity = critical
          receiver: Critical
