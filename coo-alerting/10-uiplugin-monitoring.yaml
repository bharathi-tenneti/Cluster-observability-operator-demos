---
# Monitoring console plugin - separate from the platform's own default "monitoring-plugin"
# (that one ships regardless of COO). This UIPlugin adds the Cluster Health Analyzer
# (incident detection/correlation) feature on top - one of COO's headline new features.
# acm/perses proxies left off - not using ACM or Perses dashboards here.
apiVersion: observability.openshift.io/v1alpha1
kind: UIPlugin
metadata:
  name: monitoring
spec:
  type: Monitoring
  monitoring:
    clusterHealthAnalyzer:
      enabled: true
