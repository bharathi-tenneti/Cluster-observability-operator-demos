---
# Turns on User Workload Monitoring (UWM): the separate Prometheus + Thanos Ruler
# that lets project admins define their own ServiceMonitors/PodMonitors and
# PrometheusRules for their own namespaces, without needing cluster-admin access
# to openshift-monitoring.
#
# Two things in this repo depend on this being enabled:
#   - 03/04: remote_write of UWM metrics to New Relic (New Relic-specific, skip
#     if not doing that)
#   - 07-prometheusrule-container-thresholds.yaml: container-level alerting rules
#     in a user application namespace (this is the generic, non-New-Relic path)
#
# This does NOT touch platform Prometheus (prometheusK8s) or its metrics - only
# spins up the separate user-workload Prometheus/Thanos Ruler instances.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: true
