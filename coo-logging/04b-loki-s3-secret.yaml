---
# LokiStack (06-lokistack.yaml) expects a secret named logging-loki-s3 with these
# exact key names. ODF/NooBaa's ObjectBucketClaim (04-loki-object-bucket-claim.yaml)
# auto-generates a *different* secret ("loki-bucket-odf") with different key names
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) plus a configmap holding the bucket
# host/port/name — those values are randomly generated per-run, so copy them in
# here by hand before applying:
#
#   oc get cm loki-bucket-odf -n openshift-logging -o yaml
#   oc get secret loki-bucket-odf -n openshift-logging -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d
#   oc get secret loki-bucket-odf -n openshift-logging -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d
#
# Then: oc apply -f coo-logging/04b-loki-s3-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: logging-loki-s3
  namespace: openshift-logging
type: Opaque
stringData:
  bucketnames: <<BUCKET_NAME>>       
  endpoint: https://s3.openshift-storage.svc  
  access_key_id: <<  AWS_ACCESS_KEY_ID  >>    
  access_key_secret: <<AWS_SECRET_ACCESS_KEY>>
